[package]
name = "microbe"
version = "0.1.1"
description = "A lightweight, extensible MicroPython IDE"
edition = "2021"
rust-version = "1.88"
resolver = "3"

[lib]
name = "microbe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-serial = "5.4"
serialport = "4"
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", features = ["sink"] }
btleplug = "0.11"
uuid = "1"
espflash = { version = "4.5", default-features = false, features = ["serialport"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
scraper = "0.23"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
include_dir = "0.7"
async-trait = "0.1"
thiserror = "2"
ts-rs = { version = "10", features = ["serde-json-impl"] }
log = "0.4"
once_cell = "1"
dirs = "6"
flate2 = "1"
tar = "0.4"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
streaming-iterator = "0.1"
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
rand = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
