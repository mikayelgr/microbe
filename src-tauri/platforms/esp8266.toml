# Espressif ESP8266.
id = "esp8266"
name = "Espressif ESP8266"
sys_platform = ["esp8266"]
capabilities = ["raw_paste", "esp_rom", "serial_hard_reset"]
firmware_ext = ["bin"]
stubs = { port = "esp8266" }
# Very little RAM: keep raw-REPL transfer chunks small.
transfer_chunk = 512

usb = [
  { vid = 0x10c4, pid = 0xea60, role = "uart_bridge", note = "CP210x" },
  { vid = 0x1a86, pid = 0x7523, role = "uart_bridge", note = "CH340" },
  { vid = 0x0403, pid = 0x6001, role = "uart_bridge", note = "FTDI" },
]

[serial]
hard_reset = "esp_classic"

[[flash]]
method = "esptool"
ext = ["bin"]
offsets = { esp8266 = 0x0 }

[[detect]]
match = "esp8266"
board = "ESP8266_GENERIC"

# GPIO numbers for the static pin check.
[[pins]]
gpio = "0-16"
[[pins.reserved]]
pins = "6-11"
reason = "is connected to the SPI flash on most modules"
