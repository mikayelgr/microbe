# Builds Microbe for Linux, Windows and macOS and publishes releases (D-029).
#
# - Push to main: if no published release exists for the version in
#   src-tauri/tauri.conf.json (tag `v<version>`), builds every platform and
#   publishes release `v<version>`, tagging the pushed commit. If that version
#   was already released, nothing is built: bump the version to release again.
# - Run manually (Actions → Build → Run workflow): always builds every platform
#   and uploads the installers as workflow artifacts. Nothing is published.
#
# Installers have stable, version-free names (scripts/release-assets.mjs), so
# https://github.com/<repo>/releases/latest/download/<name> always serves the
# newest release:
#   microbe-macos-arm64.dmg      microbe-windows-x64-setup.exe
#   microbe-macos-x64.dmg        microbe-windows-x64.msi
#   microbe-linux-x64.AppImage   microbe-linux-x64.deb   microbe-linux-x64.rpm
#   SHA256SUMS.txt
#
# Binaries are unsigned; macOS Gatekeeper and Windows SmartScreen will warn.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and create a draft release
        id: check
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          npm_version=$(jq -r .version package.json)
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)
          if [[ "$version" != "$npm_version" || "$version" != "$cargo_version" ]]; then
            echo "::error::Versions differ: tauri.conf.json $version, package.json $npm_version, Cargo.toml $cargo_version"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            echo "Manual run: building $tag without publishing."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # gh finds drafts by tag name too; a draft is left over from an
          # interrupted run and is reused.
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [[ "$draft" == false ]]; then
            echo "$tag is already released. Bump the version to publish a new release."
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          notes="Unsigned builds: macOS Gatekeeper and Windows SmartScreen will warn on first launch.

          | Platform | Download |
          |---|---|
          | macOS (Apple Silicon) | [microbe-macos-arm64.dmg]($base/microbe-macos-arm64.dmg) |
          | macOS (Intel) | [microbe-macos-x64.dmg]($base/microbe-macos-x64.dmg) |
          | Windows x64 | [microbe-windows-x64-setup.exe]($base/microbe-windows-x64-setup.exe) · [.msi]($base/microbe-windows-x64.msi) |
          | Linux x64 | [microbe-linux-x64.AppImage]($base/microbe-linux-x64.AppImage) · [.deb]($base/microbe-linux-x64.deb) · [.rpm]($base/microbe-linux-x64.rpm) |"
          if [[ "$draft" == true ]]; then
            echo "Reusing the draft release for $tag, retargeted at $GITHUB_SHA."
            gh release edit "$tag" --target "$GITHUB_SHA"
          else
            echo "Creating a draft release for $tag at $GITHUB_SHA."
            gh release create "$tag" --draft --target "$GITHUB_SHA" \
              --title "Microbe $tag" --notes "$notes" --generate-notes
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libudev-dev libdbus-1-dev pkg-config build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Rust 1.88 is the MSRV the lockfile resolves against (docs/DECISIONS.md, D-012).
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Fetch sidecars (ty language server)
        run: node scripts/fetch-sidecars.mjs --target ${{ matrix.target }}

      - name: Build
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Collect installers
        run: node scripts/release-assets.mjs --target ${{ matrix.target }} --out release-assets

      - name: Attach installers to the draft release
        if: needs.prepare.outputs.release == 'true'
        shell: bash
        run: gh release upload "${{ needs.prepare.outputs.tag }}" release-assets/* --clobber

      - name: Upload installers
        if: needs.prepare.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: microbe-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Add checksums and publish
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          gh release download "$TAG" --dir "$dir" --pattern 'microbe-*'
          (cd "$dir" && sha256sum microbe-* > SHA256SUMS.txt)
          gh release upload "$TAG" "$dir/SHA256SUMS.txt" --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
